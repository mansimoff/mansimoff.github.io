name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # позволяет запускать вручную из вкладки Actions

# Права нужны именно такие — deploy-pages не сработает без id-token
permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум деплоям накладываться друг на друга
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Отдельный этап: падает быстро (обычно < 20 сек) и ДО того, как начнётся
  # реальная сборка — если YAML/Python/CSS/Typst/Jinja сломаны, незачем
  # тратить время на build/deploy.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Typst
        # Нужен здесь же — check_syntax.py компилирует resume.typ, чтобы
        # поймать синтаксические ошибки Typst до сборки PDF
        uses: typst-community/setup-typst@v3

      - name: Syntax check (yaml, py, css, jinja, typst)
        run: python check_syntax.py

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate og-image.png from resume.ru.yaml
        # Одна общая og-картинка на обе языковые версии (см. generate_og_image.py)
        run: python generate_og_image.py

      - name: Build HTML (RU → /, EN → /en/)
        run: python build.py

      - name: Install tidy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tidy

      - name: Syntax check (rendered HTML)
        # Отдельно от lint-джобы: собранный public/*.html существует только
        # после build.py, поэтому этот чек физически не может идти раньше.
        run: python check_syntax.py --html

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDFs (RU + EN)
        # Один и тот же resume.typ, разные данные по --input lang=.
        # Имя выходного файла берём из resume_pdf в соответствующем resume.<lang>.yaml —
        # переименуешь PDF там, CI и ссылка в HTML останутся синхронны сами по себе.
        run: |
          for LANG in ru en; do
            NAME=$(python -c "import yaml; print(yaml.safe_load(open('data/resume.$LANG.yaml'))['resume_pdf'])")
            typst compile resume.typ "public/$NAME" --font-path static/assets/fonts --input lang=$LANG
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
